<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たのしい！くくのあなうめマスター 🎓✨</title>
  <meta name="description" content="小学生向けのかんたん・たのしい九九穴埋め練習アプリ！ゲーム感覚で九九が得意になろう！">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-bg: #F0F4F8;
      --card-bg: #FFFFFF;
      --text-main: #2D3748;
      --accent-yellow: #FFC72C;
      --accent-orange: #FF8811;
      --accent-pink: #FF6B8B;
      --accent-blue: #4EA8DE;
      --accent-green: #06D6A0;
      --accent-purple: #9D4EDD;
      --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.07);
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.15);
      --radius-lg: 24px;
      --radius-md: 16px;
      --font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      font-family: var(--font-family);
    }

    body {
      background: linear-gradient(135deg, #E0F7FA 0%, #FFF9C4 50%, #F8BBD0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow-x: hidden;
      padding: 16px;
    }

    #app-container {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 4px solid #FFFFFF;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .app-title-sm {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--accent-orange);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sound-btn {
      background: #EDF2F7;
      border: 2px solid #CBD5E0;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .sound-btn:active {
      transform: scale(0.9);
    }

    /* 画面切り替え */
    .screen {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* メインタイトル画面 */
    .hero-banner {
      text-align: center;
      margin-bottom: 24px;
    }
    .hero-title {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(45deg, #FF6B8B, #FF8811, #4EA8DE);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .hero-subtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: #718096;
    }

    /* モード選択 */
    .mode-section-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #4A5568;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .dan-btn {
      background: #FFFFFF;
      border: 3px solid #E2E8F0;
      border-radius: var(--radius-md);
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .dan-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-blue);
    }
    .dan-btn:active {
      transform: translateY(0);
    }
    .dan-num {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-main);
    }
    .dan-sub {
      font-size: 0.75rem;
      font-weight: 700;
      color: #A0AEC0;
      margin-top: 2px;
    }
    .dan-badge {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 0.8rem;
    }

    .special-modes {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-large {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 1.2rem;
      font-weight: 900;
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .btn-mix {
      background: linear-gradient(135deg, #FF6B8B 0%, #FF8811 100%);
    }
    .btn-timeattack {
      background: linear-gradient(135deg, #4EA8DE 0%, #06D6A0 100%);
    }
    .btn-large:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      filter: brightness(1.05);
    }
    .btn-large:active {
      transform: translateY(0);
    }

    /* ゲームプレイ画面 */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F7FAFC;
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 16px;
      border: 2px solid #EDF2F7;
    }
    .progress-box {
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--accent-purple);
    }
    .timer-box {
      font-weight: 800;
      font-size: 1.1rem;
      color: #E53E3E;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .combo-badge {
      position: absolute;
      top: -12px;
      right: 20px;
      background: #FF8811;
      color: #FFF;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: none;
    }
    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* 問題カード */
    .card-container {
      position: relative;
    }
    .problem-card {
      background: #FFFFFF;
      border: 4px solid var(--accent-yellow);
      border-radius: var(--radius-lg);
      padding: 30px 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 140px;
    }
    .formula-part {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--text-main);
    }
    .blank-box {
      width: 76px;
      height: 76px;
      background: #FFF5F5;
      border: 4px dashed var(--accent-pink);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent-pink);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
    }
    .blank-box.filled {
      background: #FFF;
      border-style: solid;
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .blank-box.correct {
      background: #E6FFFA;
      border-color: var(--accent-green);
      color: var(--accent-green);
      animation: celebrate 0.4s ease;
    }
    .blank-box.wrong {
      background: #FFF5F5;
      border-color: #E53E3E;
      color: #E53E3E;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    @keyframes celebrate {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* テンキーUI */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      background: #FFFFFF;
      border: 3px solid #E2E8F0;
      border-radius: var(--radius-md);
      padding: 16px 0;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 0 4px 0 #CBD5E0;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .num-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .num-btn.btn-clear {
      background: #FED7D7;
      border-color: #FEB2B2;
      color: #C53030;
      font-size: 1.2rem;
      box-shadow: 0 4px 0 #FEB2B2;
    }
    .num-btn.btn-enter {
      background: #C6F6D5;
      border-color: #9AE6B4;
      color: #22543D;
      font-size: 1.2rem;
      box-shadow: 0 4px 0 #9AE6B4;
    }

    /* 結果画面 */
    .result-card {
      text-align: center;
      padding: 20px 10px;
    }
    .result-badge {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
    .result-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .stars-box {
      font-size: 2.8rem;
      color: #CBD5E0;
      margin-bottom: 16px;
    }
    .star-active {
      color: #FFC72C;
      text-shadow: 0 2px 8px rgba(255, 199, 44, 0.5);
    }
    .score-detail {
      background: #F7FAFC;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 24px;
      border: 2px solid #EDF2F7;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 800;
      margin: 6px 0;
      color: #4A5568;
    }
    .score-val {
      color: var(--accent-blue);
    }
    .ranking-box {
      background: #FFF7ED;
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 2px solid #FCD9A5;
    }
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 800;
      color: #7C4D00;
    }
    .ranking-empty {
      font-size: 0.9rem;
      font-weight: 700;
      color: #A0AEC0;
    }
    .action-btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .countdown-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.42);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      font-size: 5rem;
      font-weight: 900;
      color: var(--accent-pink);
      text-shadow: 0 8px 18px rgba(255, 107, 139, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10;
    }
    .countdown-overlay.visible {
      opacity: 1;
    }

    /* 紙吹雪Canvas */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

<div id="app-container">
  <canvas id="confetti-canvas"></canvas>

  <!-- ヘッダー -->
  <header>
    <div class="app-title-sm">🎓 くくのあなうめマスター</div>
    <button class="sound-btn" id="sound-toggle-btn" title="おと ON/OFF">🔊</button>
  </header>

  <!-- 1. スタート・モード選択画面 -->
  <div id="screen-start" class="screen active">
    <div class="hero-banner">
      <h1 class="hero-title">くく あなうめ<br>だいさくせん！</h1>
      <p class="hero-subtitle">？に はいる すうじを あてよう！</p>
    </div>

    <div class="mode-section-title">📌 だんを選んで れんしゅう</div>
    <div class="dan-grid" id="dan-grid">
      <!-- JSでボタン生成 -->
    </div>

    <div class="mode-section-title">🚀 チャレンジモード</div>
    <div class="special-modes">
      <button class="btn-large btn-mix" onclick="startGame('mix')">
        <span>🎲 ぜんぶミックス (10問)</span>
      </button>
      <button class="btn-large btn-timeattack" onclick="startGame('timeattack')">
        <span>⚡ タイムアタック (10問)</span>
      </button>
    </div>
  </div>

  <!-- 2. ゲームプレイ画面 -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <div class="progress-box" id="progress-text">もんだい 1/10</div>
      <div class="timer-box" id="timer-text">⏱️ 0.0s</div>
    </div>

    <div class="card-container">
      <div class="countdown-overlay" id="countdown-overlay">3</div>
      <div class="combo-badge" id="combo-badge">🔥 3れんぞく！</div>
      <div class="problem-card">
        <span class="formula-part" id="part-a">3</span>
        <span class="formula-part">×</span>
        <span class="formula-part" id="part-b">?</span>
        <span class="formula-part">=</span>
        <span class="formula-part" id="part-c">21</span>
      </div>
    </div>

    <!-- テンキーUI -->
    <div class="numpad">
      <button class="num-btn" onclick="pressNum(1)">1</button>
      <button class="num-btn" onclick="pressNum(2)">2</button>
      <button class="num-btn" onclick="pressNum(3)">3</button>
      <button class="num-btn" onclick="pressNum(4)">4</button>
      <button class="num-btn" onclick="pressNum(5)">5</button>
      <button class="num-btn" onclick="pressNum(6)">6</button>
      <button class="num-btn" onclick="pressNum(7)">7</button>
      <button class="num-btn" onclick="pressNum(8)">8</button>
      <button class="num-btn" onclick="pressNum(9)">9</button>
      <button class="num-btn btn-clear" onclick="pressClear()">けす</button>
      <button class="num-btn" onclick="pressNum(0)">0</button>
      <button class="num-btn btn-enter" onclick="pressEnter()">こたえる</button>
    </div>
  </div>

  <!-- 3. 結果画面 -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-badge" id="result-emoji">👑</div>
      <h2 class="result-title" id="result-title">すごーい！</h2>
      <div class="stars-box" id="stars-box">
        <span class="star-active">★</span>
        <span class="star-active">★</span>
        <span class="star-active">★</span>
      </div>

      <div class="score-detail">
        <div class="score-row">
          <span>せいかい</span>
          <span class="score-val" id="res-score">10 / 10 もん</span>
        </div>
        <div class="score-row">
          <span>かかったじかん</span>
          <span class="score-val" id="res-time">15.4びょう</span>
        </div>
        <div class="score-row">
          <span>さいこうれんぞく</span>
          <span class="score-val" id="res-maxcombo">10れんぞく</span>
        </div>
      </div>

      <div class="ranking-box">
        <div class="score-row">
          <span>ランキング</span>
          <span class="score-val" id="res-ranking-title">TOP 5</span>
        </div>
        <div class="ranking-list" id="ranking-list"></div>
      </div>

      <div class="action-btns">
        <button class="btn-large btn-mix" onclick="retryGame()">
          <span>🔄 もういちど あそぶ</span>
        </button>
        <button class="btn-large btn-timeattack" onclick="showStartScreen()">
          <span>🏠 とっぷに もどる</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ===================================================
   *  Sound Engine (Web Audio API)
   * =================================================== */
  let soundEnabled = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
  }

  function playSound(type) {
    if (!soundEnabled) return;
    initAudio();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const now = audioCtx.currentTime;

    if (type === 'click') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'correct') {
      // ピンポン音 (High C -> G)
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc1.type = 'triangle';
      osc2.type = 'triangle';
      
      osc1.frequency.setValueAtTime(523.25, now); // C5
      osc2.frequency.setValueAtTime(783.99, now + 0.1); // G5

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc1.stop(now + 0.1);
      osc2.start(now + 0.1);
      osc2.stop(now + 0.35);
    } else if (type === 'wrong') {
      // ブブー音
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.setValueAtTime(130, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'fanfare') {
      // ファンファーレ
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.25, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.3);
      });
    }
  }

  // ミュート切り替え
  document.getElementById('sound-toggle-btn').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    document.getElementById('sound-toggle-btn').textContent = soundEnabled ? '🔊' : '🔇';
  });

  /* ===================================================
   *  Game State & Logic
   * =================================================== */
  const TOTAL_QUESTIONS = 10;
  let currentMode = 'mix'; // 'dan-1' ~ 'dan-9', 'mix', 'timeattack'
  let currentQuestionIndex = 0;
  let questions = [];
  let currentAnswerInput = '';
  let correctCount = 0;
  let comboCount = 0;
  let maxComboCount = 0;
  let startTime = 0;
  let timerInterval = null;
  let countdownTimer = null;
  let countdownValue = 3;
  let elapsedTime = 0;
  let isChecking = false;
  let isCountdownActive = false;

  // LocalStorage 保存キー
  const STORAGE_KEY = 'kuku_master_records_v1';
  const RANKING_KEY = 'kuku_master_rankings_v1';

  function getRecords() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch(e) {
      return {};
    }
  }

  function saveRecord(mode, score, time) {
    const records = getRecords();
    if (!records[mode] || records[mode].score < score || (records[mode].score === score && records[mode].time > time)) {
      records[mode] = { score, time };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }
  }

  function getRankings() {
    try {
      const raw = JSON.parse(localStorage.getItem(RANKING_KEY));
      return raw && typeof raw === 'object' ? raw : {};
    } catch (e) {
      return {};
    }
  }

  function saveRanking(mode, time) {
    const rankings = getRankings();
    const list = Array.isArray(rankings[mode]) ? rankings[mode] : [];
    list.push({ time: Number(time), savedAt: new Date().toISOString() });
    list.sort((a, b) => a.time - b.time);
    rankings[mode] = list.slice(0, 5);
    localStorage.setItem(RANKING_KEY, JSON.stringify(rankings));
  }

  function getModeRanking(mode) {
    const rankings = getRankings();
    return Array.isArray(rankings[mode]) ? rankings[mode] : [];
  }

  function renderRankingList(mode) {
    const listEl = document.getElementById('ranking-list');
    if (!listEl) return;

    const items = getModeRanking(mode);
    if (!items.length) {
      listEl.innerHTML = '<span class="ranking-empty">まだ記録なし</span>';
      return;
    }

    listEl.innerHTML = items.map((entry, index) => `
      <div class="ranking-item">
        <span>#${index + 1}</span>
        <span>${Number(entry.time).toFixed(1)}秒</span>
      </div>
    `).join('');
  }

  // スタート画面生成
  function initStartScreen() {
    const danGrid = document.getElementById('dan-grid');
    danGrid.innerHTML = '';
    const records = getRecords();

    for (let i = 1; i <= 9; i++) {
      const modeKey = `dan-${i}`;
      const rec = records[modeKey];
      let badgeHtml = '';
      if (rec && rec.score === 10) {
        badgeHtml = '<span class="dan-badge">👑</span>';
      } else if (rec && rec.score >= 8) {
        badgeHtml = '<span class="dan-badge">⭐</span>';
      }

      const btn = document.createElement('div');
      btn.className = 'dan-btn';
      btn.onclick = () => startGame(modeKey);
      btn.innerHTML = `
        ${badgeHtml}
        <div class="dan-num">${i} のだん</div>
        <div class="dan-sub">${i}×1 〜 ${i}×9</div>
      `;
      danGrid.appendChild(btn);
    }
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function showStartScreen() {
    clearInterval(timerInterval);
    clearInterval(countdownTimer);
    isCountdownActive = false;
    const countdownEl = document.getElementById('countdown-overlay');
    if (countdownEl) {
      countdownEl.classList.remove('visible');
    }
    initStartScreen();
    showScreen('screen-start');
  }

  // 問題作成
  function generateQuestions(mode) {
    const qList = [];
    
    for (let i = 0; i < TOTAL_QUESTIONS; i++) {
      let a, b;
      if (mode.startsWith('dan-')) {
        a = parseInt(mode.split('-')[1]);
        b = Math.floor(Math.random() * 9) + 1;
      } else {
        a = Math.floor(Math.random() * 9) + 1;
        b = Math.floor(Math.random() * 9) + 1;
      }

      const product = a * b;
      // 穴埋めの位置（0: 答え穴埋め, 1: 被乗数穴埋め, 2: 乗数穴埋め）
      const blankType = Math.floor(Math.random() * 3);
      
      let targetAnswer;
      if (blankType === 0) targetAnswer = product;
      else if (blankType === 1) targetAnswer = a;
      else targetAnswer = b;

      qList.push({
        numA: a,
        numB: b,
        product: product,
        blankType: blankType,
        targetAnswer: targetAnswer
      });
    }
    return qList;
  }

  function startGame(mode) {
    playSound('click');
    currentMode = mode;
    currentQuestionIndex = 0;
    correctCount = 0;
    comboCount = 0;
    maxComboCount = 0;
    currentAnswerInput = '';
    isChecking = false;
    elapsedTime = 0;
    startTime = 0;
    clearInterval(timerInterval);
    clearInterval(countdownTimer);
    isCountdownActive = true;

    questions = generateQuestions(mode);
    showScreen('screen-game');
    updateTimer();
    startCountdown();
  }

  function startCountdown() {
    const countdownEl = document.getElementById('countdown-overlay');
    if (!countdownEl) return;

    countdownValue = 3;
    countdownEl.textContent = countdownValue;
    countdownEl.classList.add('visible');

    if (countdownTimer) clearInterval(countdownTimer);

    countdownTimer = setInterval(() => {
      countdownValue -= 1;

      if (countdownValue > 0) {
        countdownEl.textContent = countdownValue;
        return;
      }

      clearInterval(countdownTimer);
      countdownTimer = null;
      countdownEl.classList.remove('visible');
      isCountdownActive = false;
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 100);
      renderQuestion();
    }, 1000);
  }

  function updateTimer() {
    elapsedTime = (Date.now() - startTime) / 1000;
    document.getElementById('timer-text').textContent = `⏱️ ${elapsedTime.toFixed(1)}s`;
  }

  function renderQuestion() {
    if (currentQuestionIndex >= TOTAL_QUESTIONS) {
      finishGame();
      return;
    }

    const q = questions[currentQuestionIndex];
    currentAnswerInput = '';
    
    document.getElementById('progress-text').textContent = `もんだい ${currentQuestionIndex + 1}/${TOTAL_QUESTIONS}`;

    const partA = document.getElementById('part-a');
    const partB = document.getElementById('part-b');
    const partC = document.getElementById('part-c');

    // 穴埋めUIの初期化
    [partA, partB, partC].forEach(el => {
      el.className = 'formula-part';
      el.onclick = null;
    });

    if (q.blankType === 0) {
      partA.textContent = q.numA;
      partB.textContent = q.numB;
      partC.innerHTML = '<div class="blank-box" id="active-blank">?</div>';
    } else if (q.blankType === 1) {
      partA.innerHTML = '<div class="blank-box" id="active-blank">?</div>';
      partB.textContent = q.numB;
      partC.textContent = q.product;
    } else {
      partA.textContent = q.numA;
      partB.innerHTML = '<div class="blank-box" id="active-blank">?</div>';
      partC.textContent = q.product;
    }

    // コンボ表示
    const comboBadge = document.getElementById('combo-badge');
    if (comboCount >= 2) {
      comboBadge.style.display = 'block';
      comboBadge.textContent = `🔥 ${comboCount}れんぞく！`;
    } else {
      comboBadge.style.display = 'none';
    }
  }

  function updateBlankUI() {
    const blankEl = document.getElementById('active-blank');
    if (!blankEl) return;

    if (currentAnswerInput === '') {
      blankEl.textContent = '?';
      blankEl.classList.remove('filled');
    } else {
      blankEl.textContent = currentAnswerInput;
      blankEl.classList.add('filled');
    }
  }

  // 入力処理
  function pressNum(num) {
    if (isChecking || isCountdownActive) return;
    playSound('click');
    
    // 入力は最大2桁まで
    if (currentAnswerInput.length < 2) {
      currentAnswerInput += num.toString();
      updateBlankUI();

      // 自動判定チェック
      const q = questions[currentQuestionIndex];
      const targetStr = q.targetAnswer.toString();
      
      // 正解の桁数に達したら自動判定
      if (currentAnswerInput.length === targetStr.length) {
        checkAnswer();
      }
    }
  }

  function pressClear() {
    if (isChecking || isCountdownActive) return;
    playSound('click');
    currentAnswerInput = '';
    updateBlankUI();
  }

  function pressEnter() {
    if (isChecking || isCountdownActive || currentAnswerInput === '') return;
    checkAnswer();
  }

  function checkAnswer() {
    if (isChecking) return;
    isChecking = true;

    const q = questions[currentQuestionIndex];
    const userVal = parseInt(currentAnswerInput, 10);
    const blankEl = document.getElementById('active-blank');

    if (userVal === q.targetAnswer) {
      // 正解！
      playSound('correct');
      if (blankEl) blankEl.classList.add('correct');
      correctCount++;
      comboCount++;
      if (comboCount > maxComboCount) maxComboCount = comboCount;

      setTimeout(() => {
        currentQuestionIndex++;
        isChecking = false;
        renderQuestion();
      }, 600);
    } else {
      // 不正解
      playSound('wrong');
      if (blankEl) blankEl.classList.add('wrong');
      comboCount = 0;

      setTimeout(() => {
        if (blankEl) blankEl.classList.remove('wrong');
        currentAnswerInput = '';
        updateBlankUI();
        isChecking = false;
      }, 700);
    }
  }

  // ゲーム終了
  function finishGame() {
    clearInterval(timerInterval);
    playSound('fanfare');

    saveRecord(currentMode, correctCount, elapsedTime);
    saveRanking(currentMode, elapsedTime);
    renderRankingList(currentMode);

    document.getElementById('res-score').textContent = `${correctCount} / ${TOTAL_QUESTIONS} もん`;
    document.getElementById('res-time').textContent = `${elapsedTime.toFixed(1)}びょう`;
    document.getElementById('res-maxcombo').textContent = `${maxComboCount}れんぞく`;
    document.getElementById('res-ranking-title').textContent = `TOP ${Math.min(getModeRanking(currentMode).length, 5)}`;

    const starsBox = document.getElementById('stars-box');
    const resultTitle = document.getElementById('result-title');
    const resultEmoji = document.getElementById('result-emoji');

    if (correctCount === 10) {
      starsBox.innerHTML = '<span class="star-active">★</span><span class="star-active">★</span><span class="star-active">★</span>';
      resultTitle.textContent = 'パーフェクト！九九はかせ！';
      resultEmoji.textContent = '👑';
      launchConfetti();
    } else if (correctCount >= 8) {
      starsBox.innerHTML = '<span class="star-active">★</span><span class="star-active">★</span><span>☆</span>';
      resultTitle.textContent = 'すごい！あとすこし！';
      resultEmoji.textContent = '🌟';
      launchConfetti();
    } else if (correctCount >= 5) {
      starsBox.innerHTML = '<span class="star-active">★</span><span>☆</span><span>☆</span>';
      resultTitle.textContent = 'よくがんばったね！';
      resultEmoji.textContent = '😊';
    } else {
      starsBox.innerHTML = '<span>☆</span><span>☆</span><span>☆</span>';
      resultTitle.textContent = 'なんどもれんしゅうしよう！';
      resultEmoji.textContent = '🐣';
    }

    showScreen('screen-result');
  }

  function retryGame() {
    startGame(currentMode);
  }

  /* ===================================================
   *  Key Input Listener (PC Keyboard)
   * =================================================== */
  window.addEventListener('keydown', (e) => {
    const gameScreen = document.getElementById('screen-game');
    if (!gameScreen.classList.contains('active')) return;
    if (isCountdownActive) return;

    if (e.key >= '0' && e.key <= '9') {
      pressNum(parseInt(e.key, 10));
    } else if (e.key === 'Backspace' || e.key === 'Delete') {
      pressClear();
    } else if (e.key === 'Enter') {
      pressEnter();
    }
  });

  /* ===================================================
   *  Confetti Animation System
   * =================================================== */
  function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    const pieces = [];
    const colors = ['#FF6B8B', '#FF8811', '#FFC72C', '#4EA8DE', '#06D6A0', '#9D4EDD'];

    for (let i = 0; i < 60; i++) {
      pieces.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.7) * 14,
        size: Math.random() * 8 + 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rSpeed: (Math.random() - 0.5) * 10
      });
    }

    let startTime = Date.now();

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();
      if (now - startTime > 2500) return;

      pieces.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4; // 重力
        p.rotation += p.rSpeed;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });

      requestAnimationFrame(update);
    }

    update();
  }

  // 初期化実行
  showStartScreen();
</script>
</body>
